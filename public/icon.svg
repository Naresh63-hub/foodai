<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle inset border -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Centered Icon Group -->
  <g filter="url(#shadow)">
    <!-- Main Leaf Body -->
    <path d="M 368 144 C 230 136 148 220 152 352 C 196 364 260 360 318 316 C 374 274 380 196 368 144 Z" fill="url(#leafGrad)"/>
    
    <!-- Central AI Pulse / Leaf Vein Stem -->
    <path d="M 164 340 Q 236 290 286 230" fill="none" stroke="#059669" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Connected Neural / Circuit Nodes -->
    <line x1="230" y1="274" x2="210" y2="236" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 1"/>
    <circle cx="206" cy="230" r="10" fill="#047857"/>

    <line x1="262" y1="250" x2="304" y2="246" stroke="#059669" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 1"/>
    <circle cx="310" cy="245" r="10" fill="#047857"/>

    <!-- Dynamic AI Spark / Star Accent at Tip -->
    <g transform="translate(378, 134)" filter="url(#glow)">
      <circle cx="0" cy="0" r="16" fill="#fef08a"/>
      <path d="M 0 -28 L 6 -8 L 26 0 L 6 8 L 0 28 L -6 8 L -26 0 L -6 -8 Z" fill="#ffffff"/>
    </g>

    <!-- Bowl / Safety Cradle Arc -->
    <path d="M 140 330 C 140 395 210 420 256 420 C 302 420 372 395 372 330" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.95"/>
    <circle cx="140" cy="330" r="9" fill="#ffffff"/>
    <circle cx="372" cy="330" r="9" fill="#ffffff"/>
  </g>
</svg>
