name: Android APK Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.0.1) to publish a GitHub Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build production web bundle
        env:
          VITE_API_URL: https://foodai-1-cht5.onrender.com
          VITE_GOOGLE_CLIENT_ID: 59556325769-489r0888tuooujuq25ikpuf5i0ethlgj.apps.googleusercontent.com
          VITE_AUTH_BYPASS: 'false'
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android assets
        run: |
          cd frontend
          npx cap sync android

      - name: Restore Android keystore if configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
            echo "Restored consistent signing keystore from secret."
          fi

      - name: Compile Android APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../FoodAI.apk

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodAI-apk
          path: FoodAI.apk
          retention-days: 30

      - name: Publish GitHub Release with FoodAI.apk
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: FoodAI ${{ github.event.inputs.release_tag || github.ref_name }}
          files: FoodAI.apk
          generate_release_notes: true
