name: E2E (Playwright)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e-ci.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest

    # The app initializes Firebase at import time, so the dev server needs config
    # values to render. These are non-secret placeholders (the tests only assert
    # static UI + routing, never real auth). VITE_AUTH_BYPASS stays OFF so the
    # "protected route redirects to /login" expectations hold.
    env:
      VITE_FIREBASE_API_KEY: e2e-placeholder-key
      VITE_FIREBASE_AUTH_DOMAIN: e2e-project.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: e2e-project
      VITE_FIREBASE_STORAGE_BUCKET: e2e-project.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
      VITE_FIREBASE_APP_ID: '1:1234567890:web:e2e'
      VITE_AUTH_BYPASS: 'false'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Install Playwright browser (chromium)
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Run e2e tests
      run: |
        cd frontend
        npm run test:e2e -- --project=chromium

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report
        retention-days: 3
